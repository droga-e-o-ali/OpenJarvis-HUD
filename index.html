<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.T.L.A.S Core</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="custom.css"></head>
<body><main class="atlas">
<header><button id="settings" class="gear" aria-label="Configurações">⚙</button><div class="wordmark">A.T.L.A.S <b>CORE</b></div><div class="place"><strong id="city">LOCALIZANDO</strong><time id="clock">--:--</time></div></header>
<aside class="chat-panel"><div id="conversation" class="conversation"><div class="message system">A.T.L.A.S online. Aguardando instruções.</div></div><form id="commandForm"><input id="prompt" autocomplete="off" placeholder="Digite para A.T.L.A.S..."><button aria-label="Enviar" type="submit">➜</button></form></aside>
      <section class="center"><div class="wheel"><div class="ticks"></div><div class="inner"><svg id="defaultLogo" viewBox="0 0 512 260" aria-label="Morcego"><path d="M25 141c49-31 92-32 132-14-16-21-27-43-30-68 32 11 58 30 78 57l19-45 32 33 32-33 19 45c20-27 46-46 78-57-3 25-14 47-30 68 40-18 83-17 132 14l-47 5 30 37-74-25-37 56-63-65-63 65-37-56-74 25 30-37z"/><path d="M110 137c48-10 91-8 146 7m0 0c55-15 98-17 146-7M256 104v93"/></svg><img id="customLogo" alt="Logo personalizada" hidden></div></div><p id="mode">SISTEMA PRONTO</p></section>
<aside class="right"><section class="panel tasks"><h2>TAREFAS</h2><div id="taskList" class="empty">Nenhuma tarefa programada.</div></section><section class="panel voice"><button id="mic" aria-label="Segure para falar"><span>♩</span></button><div id="wave" class="wave" aria-hidden="true"></div><small id="voiceStatus">SEGURE PARA FALAR</small></section><section class="panel pc"><h2>PC <i id="pcDot"></i></h2><div class="metric"><label>CPU <span id="cpuValue">--</span></label><div class="bar" id="cpuBar"></div></div><div class="metric"><label>GPU <span id="gpuValue">--</span></label><div class="bar" id="gpuBar"></div></div><div class="metric"><label>RAM <span id="ramValue">--</span></label><div class="bar" id="ramBar"></div></div></section></aside>
<section id="settingsPanel" class="settings-panel" hidden><button id="closeSettings" aria-label="Fechar">×</button><h2>CONFIGURAÇÕES</h2><label><input id="speakToggle" type="checkbox" checked> Ler respostas em voz alta</label><label class="upload-logo">TROCAR LOGO<input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button id="resetLogo" class="reset-logo" type="button">Usar morcego padrão</button></section>
</main><script src="app.js"></script></body></html>
